<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requisições POST com Javascript</title>
</head>
<body>
  <main style="display: flex; gap: 4rem; margin: 1rem 2rem;">
    <form action="http://localhost:3000/articles" method="post">
      <h2>Escrever um artigo</h2>
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" placeholder="Título do artigo">
      <br>
      <label for="author">Autor:</label>
      <input type="text" id="author" name="author" placeholder="Autor do artigo">
      <br>
      <label for="content">Conteúdo:</label>
      <textarea id="content" name="content" placeholder="Conteúdo do artigo"></textarea>
      <button type="submit">Salvar</button>
    </form>
    <div>
      <h2>Artigos</h2>
      <section id="articles"></section>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
